name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.sdk.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android 17 (API 37) platform
        id: sdk
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-37.0" "build-tools;36.0.0" > /dev/null 2>&1 || true
          # Android 17's SDK is published as "android-37.0"; give Gradle the plain "android-37" name too.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            sed -i 's/platforms;android-37.0/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml" || true
          fi
          ls $ANDROID_HOME/platforms
          echo "sdk=37" >> $GITHUB_OUTPUT
      - name: Offline "Hey Tom" model (Vosk small English, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets
          curl -sSL -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          cd /tmp && unzip -q vosk.zip && rm -rf $GITHUB_WORKSPACE/app/src/main/assets/model-en
          mv /tmp/vosk-model-small-en-us-0.15 $GITHUB_WORKSPACE/app/src/main/assets/model-en
          echo "small-en-us-0.15" > $GITHUB_WORKSPACE/app/src/main/assets/model-en/uuid
          du -sh $GITHUB_WORKSPACE/app/src/main/assets/model-en
      - name: Brand logos (#53, packed into the app)
        run: pip install pillow > /dev/null 2>&1; python3 tools/fetch_logos.py app/src/main/assets/web/logos
      - name: Unpack signing key
        env:
          SIGN_SECRET: ${{ secrets.SIGN_SECRET }}
        run: |
          if [ -z "$SIGN_SECRET" ]; then echo "::error::Missing repository secret SIGN_SECRET"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/signing.enc -pass env:SIGN_SECRET | tar -x -C app
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK (API 37, falls back to 36)
        run: |
          if ./gradlew --no-daemon assembleRelease -Ptc.sdk=37 --stacktrace > build.log 2>&1; then echo "SDK=37" > sdk_used.txt
          else
            tail -60 build.log; cp build.log build37.log
            ./gradlew --no-daemon clean assembleRelease -Ptc.sdk=36 --stacktrace > build.log 2>&1 && echo "SDK=36" > sdk_used.txt
          fi
          tail -5 build.log; test -f sdk_used.txt
      - name: Save APK to the apk branch
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/TomsCar.apk
          cp -r app/src/main/assets/web/logos out/logos 2>/dev/null || true
          echo "$(cat sdk_used.txt) commit=${GITHUB_SHA}" > out/build_info.txt; cp build37.log out/ 2>/dev/null || true
          cd out && git init -q && git checkout -q -b apk && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p out && cp build.log out/ || true
          cd out && git init -q && git checkout -q -b buildlog && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "log"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" buildlog
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: apk, path: "app/build/outputs/apk/release/*.apk", if-no-files-found: ignore }

  emulator:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: ['29', '35']
    steps:
      - uses: actions/checkout@v4
      - name: Get APK
        run: |
          git fetch origin apk --depth 1 && git checkout origin/apk -- TomsCar.apk
          mkdir -p app/build/outputs/apk/release && mv TomsCar.apk app/build/outputs/apk/release/
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == '35' && 'google_apis' || 'default' }}
          disable-animations: true
          disk-size: 6000M
          ram-size: 4096M
          cores: 4
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/smoke.sh ${{ matrix.api }}
      - name: Save screenshots
        if: always()
        run: |
          mkdir -p s && cp -r shots/* s/ 2>/dev/null || true
          cd s && git init -q && git checkout -q -b shots-${{ matrix.api }} && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" shots-${{ matrix.api }}
